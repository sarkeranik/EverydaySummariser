version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: everyday_summariser_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/data:/app/data
      - ./backend/audio_uploads:/app/audio_uploads
      - ./backend/daily_notes:/app/daily_notes
    restart: unless-stopped
