<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* ─── Pixel Fonts ─── */
    @font-face {
      font-family: 'PressStart2P';
      src: url('https://fonts.gstatic.com/s/pressstart2p/v15/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'VT323';
      src: url('https://fonts.gstatic.com/s/vt323/v17/pxiKyp0ihIEF2isfFJXUdVNF.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }

    :root {
      --bg-primary: #0f0f23;
      --bg-secondary: #1a1a2e;
      --bg-card: #16213e;
      --bg-card-hover: #1c2a4a;
      --border-pixel: #4a4a6a;
      --text-primary: #e0e0ff;
      --text-secondary: #8888aa;
      --text-muted: #5a5a7a;
      --accent-primary: #7c3aed;
      --accent-danger: #ff4444;
      --pixel-green: #00ff88;
      --pixel-cyan: #00d4ff;
      --font-pixel: 'PressStart2P', monospace;
      --font-body: 'VT323', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      width: 380px;
      min-height: 500px;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      image-rendering: pixelated;
    }

    /* CRT scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
      pointer-events: none; z-index: 9999;
    }

    .container { position: relative; z-index: 1; padding: 16px; }

    /* ─── Header ─── */
    .header {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--border-pixel);
      margin-bottom: 12px;
    }
    .header-icon {
      font-size: 24px;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .header h1 {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: var(--accent-primary);
      text-shadow: 2px 2px 0 rgba(124, 58, 237, 0.2);
    }
    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ─── Status ─── */
    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      padding: 8px 12px;
      border: 2px solid var(--border-pixel);
      background: var(--bg-card);
    }
    .status-left { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--border-pixel);
    }
    .status-dot.online {
      background: var(--pixel-green);
      animation: blink 1.5s step-end infinite;
    }
    .status-dot.offline { background: var(--accent-danger); }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    .status-label {
      font-size: 16px;
      color: var(--text-secondary);
    }
    .status-badge {
      font-family: var(--font-pixel);
      font-size: 7px;
      padding: 3px 8px;
      border: 2px solid var(--border-pixel);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-badge.online { border-color: var(--pixel-green); color: var(--pixel-green); }
    .status-badge.offline { border-color: var(--accent-danger); color: var(--accent-danger); }
    .status-badge.checking { border-color: #ffaa00; color: #ffaa00; }

    /* ─── Stats Grid ─── */
    .section-label {
      font-family: var(--font-pixel);
      font-size: 7px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 2px solid var(--border-pixel);
      padding: 10px 6px;
      text-align: center;
    }
    .stat-card:hover {
      border-color: var(--accent-primary);
    }
    .stat-icon { font-size: 18px; margin-bottom: 4px; display: block; }
    .stat-value {
      font-family: var(--font-pixel);
      font-size: 16px;
      color: var(--pixel-green);
      line-height: 1;
      margin-bottom: 3px;
      text-shadow: 0 0 6px rgba(0, 255, 136, 0.3);
    }
    .stat-label {
      font-family: var(--font-pixel);
      font-size: 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ─── Generate Button ─── */
    .generate-btn {
      width: 100%;
      padding: 12px;
      border: 3px solid #5b21b6;
      background: var(--accent-primary);
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 10px;
      cursor: pointer;
      text-transform: uppercase;
      margin-bottom: 10px;
      box-shadow: 4px 4px 0 #3b0764;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .generate-btn:hover { background: #6d28d9; }
    .generate-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #3b0764; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .spinner {
      display: none; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      animation: spin 0.8s steps(8) infinite;
    }
    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Result Box ─── */
    .result-box {
      display: none;
      border: 2px solid var(--pixel-green);
      background: rgba(0, 255, 136, 0.05);
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .result-box.error { border-color: var(--accent-danger); background: rgba(255, 68, 68, 0.05); }
    .result-box.visible { display: block; }
    .result-header span {
      font-family: var(--font-body);
      font-size: 18px;
      color: var(--pixel-green);
    }
    .result-box.error .result-header span { color: var(--accent-danger); }
    .result-path {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 8px;
      margin-top: 6px;
      gap: 8px;
    }
    .result-path code {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--pixel-cyan);
      word-break: break-all;
      flex: 1;
    }
    .copy-btn {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 14px; padding: 4px;
    }
    .copy-btn:hover { color: var(--text-primary); }

    /* ─── Quick Actions ─── */
    .actions-row {
      display: flex; gap: 8px;
      margin-bottom: 10px;
    }
    .action-card {
      flex: 1;
      background: var(--bg-card);
      border: 2px solid var(--border-pixel);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-card:hover {
      border-color: var(--accent-primary);
    }
    .action-info { flex: 1; }
    .action-title {
      font-family: var(--font-body);
      font-size: 18px;
      color: var(--text-primary);
    }
    .action-desc {
      font-family: var(--font-pixel);
      font-size: 7px;
      color: var(--text-muted);
    }

    /* Toggle Switch */
    .toggle { position: relative; width: 38px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--border-pixel);
      border: 2px solid var(--text-muted);
      cursor: pointer;
    }
    .toggle-track::after {
      content: ''; position: absolute;
      top: 2px; left: 2px; width: 12px; height: 12px;
      background: var(--text-muted);
      transition: transform 0.1s step-end;
    }
    .toggle input:checked + .toggle-track {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }
    .toggle input:checked + .toggle-track::after {
      transform: translateX(18px); background: #fff;
    }

    .clear-btn {
      background: rgba(255, 68, 68, 0.1);
      border: 2px solid rgba(255, 68, 68, 0.2);
      color: var(--accent-danger);
      font-family: var(--font-pixel);
      font-size: 8px;
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .clear-btn:hover {
      background: rgba(255, 68, 68, 0.2);
      border-color: rgba(255, 68, 68, 0.4);
    }

    /* ─── Dashboard / Sidepanel Launchers ─── */
    .launchers {
      display: flex; gap: 8px;
      margin-bottom: 10px;
    }
    .launcher-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid var(--border-pixel);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-family: var(--font-pixel);
      font-size: 7px;
      cursor: pointer;
      text-align: center;
      text-transform: uppercase;
    }
    .launcher-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* ─── Footer ─── */
    .footer {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; padding-top: 10px;
      border-top: 2px solid var(--border-pixel);
      margin-top: 4px;
    }
    .footer span {
      font-family: var(--font-pixel);
      font-size: 6px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* ─── Toast ─── */
    .tooltip {
      position: fixed; bottom: 12px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      padding: 8px 14px;
      font-family: var(--font-pixel); font-size: 8px;
      background: var(--bg-card);
      border: 2px solid var(--accent-primary);
      color: var(--text-primary);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }
    .tooltip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <span class="header-icon">📓</span>
      <div>
        <h1>Everyday Summariser</h1>
        <p>Your AI browsing journal</p>
      </div>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <div class="status-left">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-label" id="statusLabel">Checking backend…</span>
      </div>
      <span class="status-badge checking" id="statusBadge">CHECKING</span>
    </div>

    <!-- Stats -->
    <div class="section-label">Today's Captures</div>
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-icon">📝</span>
        <div class="stat-value" id="statTexts">–</div>
        <div class="stat-label">Pages</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🖼️</span>
        <div class="stat-value" id="statImages">–</div>
        <div class="stat-label">Images</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🎵</span>
        <div class="stat-value" id="statAudios">–</div>
        <div class="stat-label">Audio</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🎬</span>
        <div class="stat-value" id="statYoutubes">–</div>
        <div class="stat-label">YouTube</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">📄</span>
        <div class="stat-value" id="statPdfs">–</div>
        <div class="stat-label">PDFs</div>
      </div>
      <div class="stat-card">
        <span class="stat-icon">🐦</span>
        <div class="stat-value" id="statTweets">–</div>
        <div class="stat-label">Tweets</div>
      </div>
    </div>

    <!-- Generate -->
    <div class="section-label">Generate</div>
    <button class="generate-btn" id="generateBtn">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">✨ Generate Daily Note</span>
    </button>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      <div class="result-header">
        <span id="resultTitle">✅ Note saved successfully</span>
      </div>
      <div class="result-path">
        <code id="resultPath"></code>
        <button class="copy-btn" id="copyBtn" title="Copy path">📋</button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="section-label">Quick Actions</div>
    <div class="actions-row">
      <div class="action-card" id="toggleCard">
        <div class="action-info">
          <div class="action-title">Capture</div>
          <div class="action-desc" id="captureStatus">Active</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="captureToggle" checked>
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="action-card" style="justify-content: center;">
        <button class="clear-btn" id="clearBtn">🗑️ Clear Today</button>
      </div>
    </div>

    <!-- Temporary pause: stop capturing without having to remember to switch it back on -->
    <div class="actions-row" style="margin-top:8px;">
      <div class="action-card" style="justify-content:center; gap:6px;">
        <button class="launcher-btn" id="pause30" style="flex:1;">⏸ 30m</button>
        <button class="launcher-btn" id="pause60" style="flex:1;">⏸ 1h</button>
        <button class="launcher-btn" id="resumeBtn" style="flex:1; display:none;">▶ Resume</button>
      </div>
    </div>

    <!-- Launchers -->
    <div class="launchers">
      <button class="launcher-btn" id="openDashboard">📊 Dashboard</button>
      <button class="launcher-btn" id="openSidepanel">📌 Side Panel</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>Everyday Summariser v2.0</span>
      <span>•</span>
      <span>Powered by AI</span>
    </div>
  </div>

  <!-- Toast -->
  <div class="tooltip" id="tooltip"></div>

  <script src="api.js"></script>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
